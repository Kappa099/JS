<body>
        <header>
             <h1><a href="./Index.html">Hotels</h1> </a>  
         </header>

        <div class="book">

                <div class="chidleft">
                
                </div>
                <div class="childright">
                    <form class="reservation-card" style="border: 1px solid #ddd; padding: 20px; border-radius: 10px; background:rgb(248, 248, 248); box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);">
                        <h3 style="text-align: center; margin-bottom: 15px;">Reservation</h3>
                        
                        <label>Check-in</label>
                        <input type="date" id="checkin" value="2025-03-20" class="form-control inpChackin" >
                        
                        <label>Check-out</label>
                        <input type="date" id="checkout" value="2025-03-22" class="form-control inpChackOut">
            
                        <label>Customer Name</label>
                        <input type="text" id="customerName" class="form-control inpName" placeholder="Enter your name">
            
                        <label>Customer Tel: Phone</label>
                        <input type="text" id="customerPhone" class="form-control inpPhone" placeholder="Enter your phone number">

            
                        <button  
                            class="btn btn-primary w-100" style="background: linear-gradient(to bottom,rgb(141, 215, 247), #57b0e3); border: none; padding: 10px; font-size: 16px; cursor: pointer;">
                            BOOK NOW
                        </button>
                    </form>
                
                </div>
            
            
        </div>
