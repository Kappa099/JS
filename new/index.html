<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* General styling for the body */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
}

/* Container for the product catalog */
#product-list {
    width: 80%;
    margin: 30px auto;
    padding: 20px;
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

/* Button styling */
button {
    padding: 10px 20px;
    font-size: 16px;
    margin: 10px;
    cursor: pointer;
    border-radius: 5px;
    border: 1px solid #ddd;
    background-color: #4CAF50;
    color: white;
    transition: background-color 0.3s;
}

/* Hover effect for buttons */
button:hover {
    background-color: #45a049;
}

/* Styling for product list */
ul {
    list-style-type: none;
    padding: 0;
}

li {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.product-name {
    font-weight: bold;
}

.product-price {
    color: #333;
}

.product-stock {
    font-size: 14px;
    color: #888;
}

    </style>
</head>
<body>
    
    <div id="product-list">
        <ul>

        </ul>
    </div>
    <button id="check-availability-btn">Check Availability</button>
    <div id="product-form">
        <input type="text" id="product-name" placeholder="Product Name" />
        <input type="number" id="product-price" placeholder="Product Price" />
        <input type="number" id="product-stock" placeholder="Product Stock" />
        <button id="add-product-btn">Add Product</button>
    </div>

    <script src="./app.js"></script>
</body>
</html>
